[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptorium-l10n"
version = "0.4.0"
description = "Deterministic localization pipeline with pluggable LLM backends and a local review workbench"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AstraKismet-Isida" }]
keywords = ["localization", "i18n", "translation", "zh-TW", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Localization",
]
# No runtime dependencies, on purpose: the pipeline must run from a bare Python
# on a locked-down machine, in CI, and inside an agent sandbox without a install step.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
lx = "scriptorium.cli:main"

[project.urls]
Homepage = "https://github.com/AstraKismet/scriptorium"
Issues = "https://github.com/AstraKismet/scriptorium/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursive on purpose. A single-level `web/static/*` shipped index.html and
# nothing under it, so a bundler emitting hashed assets into `static/assets/`
# produced a wheel whose workbench is a blank page — while the checkout and the
# dev server both looked fine, because the server serves any depth under the
# static root. Green everywhere except in `pip install`.
scriptorium = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
