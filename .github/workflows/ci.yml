name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; nothing here needs more.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Windows stays in the matrix deliberately. The round-trip defects this
        # suite is growing to catch are CRLF-specific, and Windows is the
        # primary development platform.
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The guard on invariant 1, and it must stay before the install step.
      #
      # PYTHONPATH=src rather than an install is the entire point: this proves
      # the pipeline runs from a plain source tree with nothing installed and no
      # dependencies present, which is exactly how an agent sandbox or a
      # vendored tools/scriptorium/ consumes it. Running it after
      # `pip install -e .` — as this job used to — proved nothing, because by
      # then the package is on the path either way.
      - name: Bare interpreter smoke test
        run: python -m scriptorium --version
        env:
          PYTHONPATH: src

      - run: pip install -e ".[dev]"

      - run: python -m pytest -q

      - name: Lint
        if: matrix.python == '3.12'
        run: python -m ruff check src tests

  cli:
    name: CLI end-to-end (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The unit tests exercise functions; this exercises the CLI from an empty
    # directory, which is what a new user actually does. No model is called.
    #
    # It replaces a `translations` job that could never have failed: it read a
    # root lx.config.json that does not exist in this repository, and the
    # resulting FileNotFoundError occurred inside a command substitution where
    # `set -e` does not fire — so the loop iterated zero times and the job
    # exited 0 having verified nothing.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Scaffold, extract, emit work
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp examples/sample.md "$work/"
          cd "$work"
          lx init
          lx extract sample.md --lang zh-TW
          lx todo sample.md --lang zh-TW > todo.json
          python - <<'PY'
          import json
          segments = json.load(open("todo.json", encoding="utf-8")).get("segments", [])
          assert segments, "todo emitted no segments"
          print(f"{len(segments)} pending segments")
          PY
          lx stats

      - name: check must fail while nothing is translated
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          cp examples/sample.md "$work/"
          cd "$work"
          lx init > /dev/null
          lx extract sample.md --lang zh-TW > /dev/null
          if lx check sample.md --lang zh-TW; then
            echo "::error::check exited 0 on a wholly untranslated document" >&2
            exit 1
          fi
          echo "check correctly exited non-zero"
