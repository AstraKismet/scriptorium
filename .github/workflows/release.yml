name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Only this job writes, and only to create the release.
      contents: write
    # Context values reach scripts through env, never interpolated into `run:`
    # text — a tag name may contain quotes or backticks, which is an injection
    # surface.
    env:
      TAG_NAME: ${{ github.ref_name }}
      IS_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]" build

      # A release that ships failing code is worse than no release.
      - run: python -m pytest -q
      - run: python -m ruff check src tests

      - name: Tag must match the packaged version
        if: env.IS_TAG_PUSH == 'true'
        run: |
          set -euo pipefail
          version="$(python -c 'import scriptorium; print(scriptorium.__version__)')"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "::error::tag $TAG_NAME does not match scriptorium.__version__ (v$version)" >&2
            exit 1
          fi
          echo "tag matches v$version"

      # The version is currently duplicated in pyproject.toml and __init__.py.
      # Catching a drift here is cheaper than shipping one.
      - name: pyproject version must match the package
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, pathlib, scriptorium
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          declared = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1)
          assert declared == scriptorium.__version__, (
              f"pyproject.toml says {declared}, package says {scriptorium.__version__}"
          )
          print(f"version {declared} agrees in both places")
          PY

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        if: env.IS_TAG_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(release create "$TAG_NAME"
                dist/*.tar.gz dist/*.whl dist/SHA256SUMS
                --title "Scriptorium $TAG_NAME"
                --verify-tag --generate-notes)
          # Prerelease only for a SemVer prerelease segment. A hyphen inside
          # build metadata (after +) is a normal release.
          if [[ "${TAG_NAME#v}" == *-* && "${TAG_NAME#v}" != *+*-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      # workflow_dispatch is the dry run: everything above, nothing published.
      - name: Upload dry-run artifacts
        if: env.IS_TAG_PUSH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scriptorium-release-dry-run
          path: dist/*
          if-no-files-found: error
